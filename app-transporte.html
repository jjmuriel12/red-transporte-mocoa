<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>App de Transporte</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;


const SERVICIOS = [
  {
    id: "mercancia",
    titulo: "Transporte de mercancía",
    descripcion: "Envía paquetes, carga o mudanzas de un punto a otro.",
    campos: ["origen", "destino", "peso", "descripcion"],
    Icono: (props) => (
      <svg viewBox="0 0 48 48" fill="none" {...props}>
        <path
          d="M8 16L24 8L40 16V32L24 40L8 32V16Z"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinejoin="round"
        />
        <path
          d="M8 16L24 24M24 24L40 16M24 24V40"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinejoin="round"
        />
      </svg>
    ),
  },
  {
    id: "pasajero",
    titulo: "Transporte de pasajeros",
    descripcion: "Pide un viaje para ti o para alguien más.",
    campos: ["origen", "destino", "pasajeros", "fechaHora"],
    Icono: (props) => (
      <svg viewBox="0 0 48 48" fill="none" {...props}>
        <circle cx="24" cy="14" r="6" stroke="currentColor" strokeWidth="2" />
        <path
          d="M10 40C10 30.6112 16.268 25 24 25C31.732 25 38 30.6112 38 40"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
        />
      </svg>
    ),
  },
  {
    id: "transportista",
    titulo: "Soy transportista",
    descripcion: "Ofrece tu vehículo para transportar carga o personas.",
    campos: ["nombre", "telefono", "vehiculo", "capacidadValor"],
    Icono: (props) => (
      <svg viewBox="0 0 48 48" fill="none" {...props}>
        <circle cx="24" cy="24" r="16" stroke="currentColor" strokeWidth="2" />
        <circle cx="24" cy="24" r="4" fill="currentColor" />
        <path
          d="M24 8V16M24 32V40M8 24H16M32 24H40"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
        />
      </svg>
    ),
  },
];

const SUPABASE_URL = "https://lmmbbivyhhjepjfengtt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_3rK7v9Jhd0ZRv02vU4JTeg_5Q8iXArI";
const CLAVE_ADMIN = "12227878Cv+";

const ETIQUETAS = {
  origen: "Origen",
  destino: "Destino",
  peso: "Peso aproximado (kg)",
  descripcion: "Descripción de la carga",
  pasajeros: "Número de pasajeros",
  fechaHora: "Fecha y hora",
  nombre: "Nombre completo",
  telefono: "Número de celular",
  vehiculo: "Tipo de vehículo",
  capacidadTon: "Capacidad de carga (toneladas)",
  capacidadValor: "Capacidad",
  placa: "Placa",
  zona: "Zona de operación",
};

function App() {
  const [seleccion, setSeleccion] = useState(null);
  const [datos, setDatos] = useState({});
  const [enviado, setEnviado] = useState(false);
  const [conductorElegido, setConductorElegido] = useState(null);
  const [error, setError] = useState(null);
  const [socios, setSocios] = useState([]);
  const [cargandoSocios, setCargandoSocios] = useState(false);
  const [errorSocios, setErrorSocios] = useState(null);
  const [tipoTransportista, setTipoTransportista] = useState(null); // "carga" | "pasajeros"
  const [pasajerosDisponibles, setPasajerosDisponibles] = useState([]);

  // --- Panel de administrador ---
  const [passwordAdmin, setPasswordAdmin] = useState("");
  const [adminAutenticado, setAdminAutenticado] = useState(false);
  const [errorPassword, setErrorPassword] = useState(null);
  const [adminTab, setAdminTab] = useState("carga"); // "carga" | "pasajeros"
  const [sociosAdmin, setSociosAdmin] = useState([]);
  const [cargandoAdmin, setCargandoAdmin] = useState(false);
  const [errorAdmin, setErrorAdmin] = useState(null);
  const [edicionId, setEdicionId] = useState(null);
  const [edicionDatos, setEdicionDatos] = useState({});
  const [guardandoEdicion, setGuardandoEdicion] = useState(false);

  const servicio = SERVICIOS.find((s) => s.id === seleccion);

  const manejarCambio = (campo, valor) => {
    setDatos((prev) => ({ ...prev, [campo]: valor }));
  };

  const manejarEnvio = async (e) => {
    e.preventDefault();
    const faltantes = servicio.campos.filter((campo) => !datos[campo]?.trim());
    if (faltantes.length > 0) {
      setError(
        `Falta llenar: ${faltantes.map((c) => ETIQUETAS[c]).join(", ")}`
      );
      return;
    }
    setError(null);

    if (seleccion === "transportista") {
      setEnviado(true);
      setCargandoSocios(true);
      setErrorSocios(null);
      const tabla = tipoTransportista === "pasajeros" ? "socios_pasajeros" : "socios";
      const campoCapacidad =
        tipoTransportista === "pasajeros" ? "capacidad_pasajeros" : "capacidad_ton";
      try {
        const resp = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}`, {
          method: "POST",
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
            "Content-Type": "application/json",
            Prefer: "return=representation",
          },
          body: JSON.stringify([
            {
              id: crypto.randomUUID(),
              nombre: datos.nombre,
              telefono: datos.telefono,
              vehiculo: datos.vehiculo,
              [campoCapacidad]: Number(datos.capacidadValor),
              estado: "disponible",
            },
          ]),
        });
        if (!resp.ok) {
          const textoError = await resp.text();
          throw new Error(`${resp.status}: ${textoError}`);
        }
        setEnviado(true);
      } catch (err) {
        setErrorSocios(err.message || "Error desconocido al guardar.");
      } finally {
        setCargandoSocios(false);
      }
      return;
    }

    setEnviado(true);
    setCargandoSocios(true);
    setErrorSocios(null);
    try {
      if (seleccion === "pasajero") {
        const resp = await fetch(
          `${SUPABASE_URL}/rest/v1/socios_pasajeros?select=*&estado=eq.disponible`,
          {
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
            },
          }
        );
        if (!resp.ok) throw new Error(`Error ${resp.status}`);
        const data = await resp.json();
        setPasajerosDisponibles(data);
      } else {
        const resp = await fetch(
          `${SUPABASE_URL}/rest/v1/socios?select=*&estado=eq.disponible`,
          {
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
            },
          }
        );
        if (!resp.ok) throw new Error(`Error ${resp.status}`);
        const data = await resp.json();
        setSocios(data);
      }
    } catch (err) {
      setErrorSocios(
        "No pudimos cargar los transportistas disponibles. Intenta de nuevo."
      );
    } finally {
      setCargandoSocios(false);
    }
  };

  const volver = () => {
    setSeleccion(null);
    setDatos({});
    setEnviado(false);
    setConductorElegido(null);
    setError(null);
    setSocios([]);
    setErrorSocios(null);
    setTipoTransportista(null);
    setPasajerosDisponibles([]);
    setPasswordAdmin("");
    setAdminAutenticado(false);
    setErrorPassword(null);
    setSociosAdmin([]);
    setEdicionId(null);
    setErrorAdmin(null);
  };

  const tablaAdmin = adminTab === "pasajeros" ? "socios_pasajeros" : "socios";
  const campoCapacidadAdmin =
    adminTab === "pasajeros" ? "capacidad_pasajeros" : "capacidad_ton";

  const cargarSociosAdmin = async (tabla = tablaAdmin) => {
    setCargandoAdmin(true);
    setErrorAdmin(null);
    try {
      const resp = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}?select=*`, {
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        },
      });
      if (!resp.ok) throw new Error(`${resp.status}: ${await resp.text()}`);
      const data = await resp.json();
      setSociosAdmin(data);
    } catch (err) {
      setErrorAdmin(err.message || "No pudimos cargar los transportistas.");
    } finally {
      setCargandoAdmin(false);
    }
  };

  const cambiarAdminTab = (tab) => {
    setAdminTab(tab);
    setEdicionId(null);
    cargarSociosAdmin(tab === "pasajeros" ? "socios_pasajeros" : "socios");
  };

  const verificarPassword = (e) => {
    e.preventDefault();
    if (passwordAdmin === CLAVE_ADMIN) {
      setAdminAutenticado(true);
      setErrorPassword(null);
      cargarSociosAdmin();
    } else {
      setErrorPassword("Contraseña incorrecta.");
    }
  };

  const iniciarEdicion = (socio) => {
    setEdicionId(socio.id);
    setEdicionDatos({
      nombre: socio.nombre || "",
      telefono: socio.telefono || "",
      vehiculo: socio.vehiculo || "",
      capacidad: socio[campoCapacidadAdmin] ?? "",
      placa: socio.placa || "",
      estado: socio.estado || "disponible",
    });
  };

  const cancelarEdicion = () => {
    setEdicionId(null);
    setEdicionDatos({});
  };

  const guardarEdicion = async (id) => {
    setGuardandoEdicion(true);
    setErrorAdmin(null);
    try {
      const payload = {
        nombre: edicionDatos.nombre,
        telefono: edicionDatos.telefono,
        vehiculo: edicionDatos.vehiculo,
        [campoCapacidadAdmin]: Number(edicionDatos.capacidad),
        estado: edicionDatos.estado,
      };
      if (adminTab === "carga") payload.placa = edicionDatos.placa;

      const resp = await fetch(
        `${SUPABASE_URL}/rest/v1/${tablaAdmin}?id=eq.${id}`,
        {
          method: "PATCH",
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
            "Content-Type": "application/json",
            Prefer: "return=representation",
          },
          body: JSON.stringify(payload),
        }
      );
      if (!resp.ok) throw new Error(`${resp.status}: ${await resp.text()}`);
      setEdicionId(null);
      await cargarSociosAdmin();
    } catch (err) {
      setErrorAdmin(err.message || "No pudimos guardar los cambios.");
    } finally {
      setGuardandoEdicion(false);
    }
  };

  const eliminarSocio = async (id) => {
    if (!window.confirm("¿Seguro que quieres eliminar este transportista?"))
      return;
    setErrorAdmin(null);
    try {
      const resp = await fetch(
        `${SUPABASE_URL}/rest/v1/${tablaAdmin}?id=eq.${id}`,
        {
          method: "DELETE",
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          },
        }
      );
      if (!resp.ok) throw new Error(`${resp.status}: ${await resp.text()}`);
      await cargarSociosAdmin();
    } catch (err) {
      setErrorAdmin(err.message || "No pudimos eliminar el registro.");
    }
  };


  // Mercancía filtra socios de carga por capacidad (toneladas → kg).
  // Pasajero filtra socios_pasajeros por cupos disponibles.
  const conductoresDisponibles =
    seleccion === "pasajero"
      ? datos.pasajeros
        ? pasajerosDisponibles.filter(
            (s) => Number(s.capacidad_pasajeros) >= Number(datos.pasajeros)
          )
        : pasajerosDisponibles
      : seleccion === "mercancia" && datos.peso
      ? socios.filter((s) => Number(s.capacidad_ton) * 1000 >= Number(datos.peso))
      : socios;

  return (
    <div
      style={{
        minHeight: "100vh",
        background: "#0F1720",
        color: "#E8EDF2",
        fontFamily:
          "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
        padding: "48px 24px",
        display: "flex",
        flexDirection: "column",
        alignItems: "center",
      }}
    >
      <div style={{ maxWidth: 880, width: "100%" }}>
        <header
          style={{
            marginBottom: 40,
            display: "flex",
            justifyContent: "space-between",
            alignItems: "flex-start",
            gap: 16,
            flexWrap: "wrap",
          }}
        >
          <div>
            <h1
              style={{
                fontSize: 34,
                fontWeight: 700,
                margin: 0,
                letterSpacing: "-0.02em",
              }}
            >
              ¿Qué necesitas hoy?
            </h1>
            <p style={{ color: "#8A97A3", fontSize: 16, marginTop: 8 }}>
              Elige un servicio para continuar.
            </p>
          </div>

          {seleccion && (
            <button
              onClick={volver}
              style={{
                background: "#16212C",
                border: "1px solid #263141",
                borderRadius: 8,
                padding: "10px 16px",
                color: "#E8EDF2",
                fontSize: 14,
                fontWeight: 700,
                cursor: "pointer",
                display: "flex",
                alignItems: "center",
                gap: 8,
                flexShrink: 0,
              }}
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                style={{ width: 16, height: 16 }}
              >
                <path
                  d="M3 11L12 4L21 11"
                  stroke="currentColor"
                  strokeWidth="2"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                />
                <path
                  d="M5 10V19C5 19.5523 5.44772 20 6 20H9V15C9 14.4477 9.44772 14 10 14H14C14.5523 14 15 14.4477 15 15V20H18C18.5523 20 19 19.5523 19 19V10"
                  stroke="currentColor"
                  strokeWidth="2"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                />
              </svg>
              Inicio
            </button>
          )}
        </header>

        {!seleccion && (
          <div
            style={{
              display: "grid",
              gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))",
              gap: 16,
            }}
          >
            {SERVICIOS.map((s) => (
              <button
                key={s.id}
                onClick={() => setSeleccion(s.id)}
                style={{
                  background: "#16212C",
                  border: "1px solid #263141",
                  borderRadius: 14,
                  padding: 24,
                  textAlign: "left",
                  cursor: "pointer",
                  color: "inherit",
                  transition: "border-color 0.15s ease, transform 0.15s ease",
                  display: "flex",
                  flexDirection: "column",
                  gap: 14,
                }}
                onMouseEnter={(e) => {
                  e.currentTarget.style.borderColor = "#FF7A33";
                  e.currentTarget.style.transform = "translateY(-2px)";
                }}
                onMouseLeave={(e) => {
                  e.currentTarget.style.borderColor = "#263141";
                  e.currentTarget.style.transform = "translateY(0)";
                }}
              >
                <s.Icono
                  style={{ width: 36, height: 36, color: "#FF7A33" }}
                />
                <div>
                  <div style={{ fontSize: 18, fontWeight: 700 }}>
                    {s.titulo}
                  </div>
                  <div
                    style={{ fontSize: 14, color: "#8A97A3", marginTop: 6 }}
                  >
                    {s.descripcion}
                  </div>
                </div>
              </button>
            ))}
          </div>
        )}

        {!seleccion && (
          <div style={{ marginTop: 24, textAlign: "center" }}>
            <button
              onClick={() => setSeleccion("admin")}
              style={{
                background: "none",
                border: "none",
                color: "#8A97A3",
                fontSize: 13,
                cursor: "pointer",
                textDecoration: "underline",
              }}
            >
              Panel de administrador
            </button>
          </div>
        )}

        {seleccion === "admin" && !adminAutenticado && (
          <div
            style={{
              background: "#16212C",
              border: "1px solid #263141",
              borderRadius: 14,
              padding: 32,
              maxWidth: 360,
              margin: "0 auto",
            }}
          >
            <h2 style={{ fontSize: 20, fontWeight: 700, marginTop: 0 }}>
              Acceso de administrador
            </h2>
            <form
              onSubmit={verificarPassword}
              style={{ display: "flex", flexDirection: "column", gap: 16 }}
            >
              <label
                style={{ display: "flex", flexDirection: "column", gap: 6 }}
              >
                <span style={{ fontSize: 13, color: "#8A97A3" }}>
                  Contraseña
                </span>
                <input
                  type="password"
                  value={passwordAdmin}
                  onChange={(e) => {
                    setPasswordAdmin(e.target.value);
                    setErrorPassword(null);
                  }}
                  style={{
                    background: "#0F1720",
                    border: "1px solid #263141",
                    borderRadius: 8,
                    padding: "10px 12px",
                    color: "#E8EDF2",
                    fontSize: 15,
                    outline: "none",
                  }}
                />
              </label>
              {errorPassword && (
                <div style={{ color: "#FF7A33", fontSize: 13 }}>
                  {errorPassword}
                </div>
              )}
              <button
                type="submit"
                style={{
                  background: "#FF7A33",
                  border: "none",
                  borderRadius: 8,
                  padding: "12px 20px",
                  color: "#0F1720",
                  fontWeight: 700,
                  fontSize: 15,
                  cursor: "pointer",
                }}
              >
                Entrar
              </button>
            </form>
          </div>
        )}

        {seleccion === "admin" && adminAutenticado && (
          <div
            style={{
              background: "#16212C",
              border: "1px solid #263141",
              borderRadius: 14,
              padding: 32,
            }}
          >
            <div style={{ fontSize: 20, fontWeight: 700, marginBottom: 16 }}>
              Transportistas registrados
            </div>

            <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
              <button
                onClick={() => cambiarAdminTab("carga")}
                style={{
                  background: adminTab === "carga" ? "#FF7A33" : "#0F1720",
                  border: "1px solid #263141",
                  borderRadius: 8,
                  padding: "8px 16px",
                  color: adminTab === "carga" ? "#0F1720" : "#E8EDF2",
                  fontWeight: 700,
                  fontSize: 13,
                  cursor: "pointer",
                }}
              >
                Carga
              </button>
              <button
                onClick={() => cambiarAdminTab("pasajeros")}
                style={{
                  background:
                    adminTab === "pasajeros" ? "#FF7A33" : "#0F1720",
                  border: "1px solid #263141",
                  borderRadius: 8,
                  padding: "8px 16px",
                  color: adminTab === "pasajeros" ? "#0F1720" : "#E8EDF2",
                  fontWeight: 700,
                  fontSize: 13,
                  cursor: "pointer",
                }}
              >
                Pasajeros
              </button>
            </div>

            {cargandoAdmin && (
              <p style={{ color: "#8A97A3", fontSize: 14 }}>Cargando...</p>
            )}

            {errorAdmin && (
              <div
                style={{
                  background: "rgba(255, 122, 51, 0.12)",
                  border: "1px solid #FF7A33",
                  borderRadius: 8,
                  padding: "10px 12px",
                  color: "#FF7A33",
                  fontSize: 13,
                  marginBottom: 16,
                }}
              >
                {errorAdmin}
              </div>
            )}

            {!cargandoAdmin && sociosAdmin.length === 0 && !errorAdmin && (
              <p style={{ color: "#8A97A3", fontSize: 14 }}>
                Todavía no hay transportistas registrados.
              </p>
            )}

            <div
              style={{ display: "flex", flexDirection: "column", gap: 12 }}
            >
              {sociosAdmin.map((s) => {
                const editando = edicionId === s.id;
                return (
                  <div
                    key={s.id}
                    style={{
                      background: "#0F1720",
                      border: "1px solid #263141",
                      borderRadius: 10,
                      padding: 18,
                    }}
                  >
                    {!editando ? (
                      <div
                        style={{
                          display: "flex",
                          justifyContent: "space-between",
                          alignItems: "center",
                          gap: 16,
                          flexWrap: "wrap",
                        }}
                      >
                        <div>
                          <div style={{ fontWeight: 700, fontSize: 16 }}>
                            {s.nombre}
                          </div>
                          <div
                            style={{
                              color: "#8A97A3",
                              fontSize: 13,
                              marginTop: 4,
                            }}
                          >
                            {s.vehiculo} ·{" "}
                            {s[campoCapacidadAdmin]}
                            {adminTab === "pasajeros" ? " cupos" : " ton"}
                            {s.placa ? ` · Placa ${s.placa}` : ""}
                          </div>
                          <div
                            style={{
                              color: "#8A97A3",
                              fontSize: 13,
                              marginTop: 4,
                            }}
                          >
                            Tel: {s.telefono} · Estado: {s.estado}
                          </div>
                        </div>
                        <div style={{ display: "flex", gap: 8 }}>
                          <button
                            onClick={() => iniciarEdicion(s)}
                            style={{
                              background: "#16212C",
                              border: "1px solid #263141",
                              borderRadius: 8,
                              padding: "8px 14px",
                              color: "#E8EDF2",
                              fontSize: 13,
                              fontWeight: 700,
                              cursor: "pointer",
                            }}
                          >
                            Editar
                          </button>
                          <button
                            onClick={() => eliminarSocio(s.id)}
                            style={{
                              background: "transparent",
                              border: "1px solid #FF7A33",
                              borderRadius: 8,
                              padding: "8px 14px",
                              color: "#FF7A33",
                              fontSize: 13,
                              fontWeight: 700,
                              cursor: "pointer",
                            }}
                          >
                            Eliminar
                          </button>
                        </div>
                      </div>
                    ) : (
                      <div
                        style={{
                          display: "flex",
                          flexDirection: "column",
                          gap: 10,
                        }}
                      >
                        {[
                          ["nombre", "Nombre"],
                          ["telefono", "Celular"],
                          ["vehiculo", "Vehículo"],
                          [
                            "capacidad",
                            adminTab === "pasajeros"
                              ? "Capacidad (cupos)"
                              : "Capacidad (ton)",
                          ],
                          ...(adminTab === "carga"
                            ? [["placa", "Placa"]]
                            : []),
                        ].map(([campo, etiqueta]) => (
                          <label
                            key={campo}
                            style={{
                              display: "flex",
                              flexDirection: "column",
                              gap: 4,
                            }}
                          >
                            <span
                              style={{ fontSize: 12, color: "#8A97A3" }}
                            >
                              {etiqueta}
                            </span>
                            <input
                              value={edicionDatos[campo] ?? ""}
                              onChange={(e) =>
                                setEdicionDatos((prev) => ({
                                  ...prev,
                                  [campo]: e.target.value,
                                }))
                              }
                              style={{
                                background: "#16212C",
                                border: "1px solid #263141",
                                borderRadius: 6,
                                padding: "8px 10px",
                                color: "#E8EDF2",
                                fontSize: 14,
                                outline: "none",
                              }}
                            />
                          </label>
                        ))}

                        <label
                          style={{
                            display: "flex",
                            flexDirection: "column",
                            gap: 4,
                          }}
                        >
                          <span style={{ fontSize: 12, color: "#8A97A3" }}>
                            Estado
                          </span>
                          <select
                            value={edicionDatos.estado ?? "disponible"}
                            onChange={(e) =>
                              setEdicionDatos((prev) => ({
                                ...prev,
                                estado: e.target.value,
                              }))
                            }
                            style={{
                              background: "#16212C",
                              border: "1px solid #263141",
                              borderRadius: 6,
                              padding: "8px 10px",
                              color: "#E8EDF2",
                              fontSize: 14,
                            }}
                          >
                            <option value="disponible">Disponible</option>
                            <option value="no disponible">
                              No disponible
                            </option>
                          </select>
                        </label>

                        <div
                          style={{ display: "flex", gap: 8, marginTop: 6 }}
                        >
                          <button
                            onClick={() => guardarEdicion(s.id)}
                            disabled={guardandoEdicion}
                            style={{
                              background: "#FF7A33",
                              border: "none",
                              borderRadius: 8,
                              padding: "8px 14px",
                              color: "#0F1720",
                              fontSize: 13,
                              fontWeight: 700,
                              cursor: "pointer",
                            }}
                          >
                            {guardandoEdicion ? "Guardando..." : "Guardar"}
                          </button>
                          <button
                            onClick={cancelarEdicion}
                            style={{
                              background: "transparent",
                              border: "1px solid #263141",
                              borderRadius: 8,
                              padding: "8px 14px",
                              color: "#8A97A3",
                              fontSize: 13,
                              fontWeight: 700,
                              cursor: "pointer",
                            }}
                          >
                            Cancelar
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {servicio &&
          !enviado &&
          seleccion === "transportista" &&
          !tipoTransportista && (
            <div
              style={{
                background: "#16212C",
                border: "1px solid #263141",
                borderRadius: 14,
                padding: 32,
              }}
            >
              <div
                style={{
                  display: "flex",
                  alignItems: "center",
                  gap: 12,
                  marginBottom: 20,
                }}
              >
                <servicio.Icono
                  style={{ width: 28, height: 28, color: "#FF7A33" }}
                />
                <h2 style={{ fontSize: 22, fontWeight: 700, margin: 0 }}>
                  {servicio.titulo}
                </h2>
              </div>
              <p style={{ color: "#8A97A3", fontSize: 14, marginBottom: 20 }}>
                ¿Qué tipo de transporte ofreces?
              </p>
              <div
                style={{
                  display: "grid",
                  gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))",
                  gap: 12,
                }}
              >
                <button
                  onClick={() => setTipoTransportista("carga")}
                  style={{
                    background: "#0F1720",
                    border: "1px solid #263141",
                    borderRadius: 10,
                    padding: 18,
                    color: "#E8EDF2",
                    fontWeight: 700,
                    fontSize: 15,
                    cursor: "pointer",
                    textAlign: "left",
                  }}
                >
                  Transporte de carga
                </button>
                <button
                  onClick={() => setTipoTransportista("pasajeros")}
                  style={{
                    background: "#0F1720",
                    border: "1px solid #263141",
                    borderRadius: 10,
                    padding: 18,
                    color: "#E8EDF2",
                    fontWeight: 700,
                    fontSize: 15,
                    cursor: "pointer",
                    textAlign: "left",
                  }}
                >
                  Transporte de pasajeros
                </button>
              </div>
            </div>
          )}

        {servicio &&
          !enviado &&
          (seleccion !== "transportista" || tipoTransportista) && (
          <div
            style={{
              background: "#16212C",
              border: "1px solid #263141",
              borderRadius: 14,
              padding: 32,
            }}
          >
            <div
              style={{
                display: "flex",
                alignItems: "center",
                gap: 12,
                marginBottom: 24,
              }}
            >
              <servicio.Icono
                style={{ width: 28, height: 28, color: "#FF7A33" }}
              />
              <h2 style={{ fontSize: 22, fontWeight: 700, margin: 0 }}>
                {servicio.titulo}
              </h2>
            </div>

            <form
              onSubmit={manejarEnvio}
              style={{ display: "flex", flexDirection: "column", gap: 16 }}
            >
              {servicio.campos.map((campo) => (
                <label
                  key={campo}
                  style={{ display: "flex", flexDirection: "column", gap: 6 }}
                >
                  <span style={{ fontSize: 13, color: "#8A97A3" }}>
                    {campo === "capacidadValor"
                      ? tipoTransportista === "pasajeros"
                        ? "Capacidad (número de pasajeros)"
                        : "Capacidad de carga (toneladas)"
                      : ETIQUETAS[campo]}
                  </span>
                  <input
                    value={datos[campo] || ""}
                    onChange={(e) => {
                      manejarCambio(campo, e.target.value);
                      if (error) setError(null);
                    }}
                    style={{
                      background: "#0F1720",
                      border: "1px solid #263141",
                      borderRadius: 8,
                      padding: "10px 12px",
                      color: "#E8EDF2",
                      fontSize: 15,
                      outline: "none",
                    }}
                    onFocus={(e) =>
                      (e.target.style.borderColor = "#FF7A33")
                    }
                    onBlur={(e) => (e.target.style.borderColor = "#263141")}
                  />
                </label>
              ))}

              {error && (
                <div
                  style={{
                    background: "rgba(255, 122, 51, 0.12)",
                    border: "1px solid #FF7A33",
                    borderRadius: 8,
                    padding: "10px 12px",
                    color: "#FF7A33",
                    fontSize: 13,
                  }}
                >
                  {error}
                </div>
              )}

              <button
                type="submit"
                style={{
                  marginTop: 8,
                  background: "#FF7A33",
                  border: "none",
                  borderRadius: 8,
                  padding: "12px 20px",
                  color: "#0F1720",
                  fontWeight: 700,
                  fontSize: 15,
                  cursor: "pointer",
                }}
              >
                Enviar solicitud
              </button>
            </form>
          </div>
        )}

        {enviado && seleccion === "transportista" && (
          <div
            style={{
              background: "#16212C",
              border: "1px solid #263141",
              borderRadius: 14,
              padding: 32,
              textAlign: "center",
            }}
          >
            {cargandoSocios ? (
              <div style={{ fontSize: 16, color: "#8A97A3" }}>
                Guardando tu registro...
              </div>
            ) : errorSocios ? (
              <>
                <div
                  style={{ fontSize: 20, fontWeight: 700, marginBottom: 8 }}
                >
                  Algo salió mal
                </div>
                <p
                  style={{
                    color: "#FF7A33",
                    fontSize: 15,
                    marginBottom: 24,
                  }}
                >
                  {errorSocios}
                </p>
                <button
                  onClick={() => {
                    setEnviado(false);
                    setErrorSocios(null);
                  }}
                  style={{
                    background: "#FF7A33",
                    border: "none",
                    borderRadius: 8,
                    padding: "10px 18px",
                    color: "#0F1720",
                    fontWeight: 700,
                    fontSize: 14,
                    cursor: "pointer",
                  }}
                >
                  Volver a intentar
                </button>
              </>
            ) : (
              <>
                <div
                  style={{ fontSize: 20, fontWeight: 700, marginBottom: 8 }}
                >
                  ¡Registro guardado!
                </div>
                <p
                  style={{ color: "#8A97A3", fontSize: 15, marginBottom: 24 }}
                >
                  Ya apareces disponible para recibir solicitudes de
                  transporte, {datos.nombre}.
                </p>
                <button
                  onClick={volver}
                  style={{
                    background: "#FF7A33",
                    border: "none",
                    borderRadius: 8,
                    padding: "10px 18px",
                    color: "#0F1720",
                    fontWeight: 700,
                    fontSize: 14,
                    cursor: "pointer",
                  }}
                >
                  Volver al inicio
                </button>
              </>
            )}
          </div>
        )}

        {enviado && seleccion !== "transportista" && !conductorElegido && (
          <div
            style={{
              background: "#16212C",
              border: "1px solid #263141",
              borderRadius: 14,
              padding: 32,
            }}
          >
            <div style={{ fontSize: 20, fontWeight: 700, marginBottom: 6 }}>
              Transportistas disponibles
            </div>

            {cargandoSocios && (
              <p style={{ color: "#8A97A3", fontSize: 14, marginBottom: 24 }}>
                Buscando transportistas...
              </p>
            )}

            {errorSocios && (
              <div
                style={{
                  background: "rgba(255, 122, 51, 0.12)",
                  border: "1px solid #FF7A33",
                  borderRadius: 8,
                  padding: "10px 12px",
                  color: "#FF7A33",
                  fontSize: 13,
                  marginBottom: 20,
                }}
              >
                {errorSocios}
              </div>
            )}

            {!cargandoSocios && !errorSocios && (
              <p style={{ color: "#8A97A3", fontSize: 14, marginBottom: 24 }}>
                {conductoresDisponibles.length > 0
                  ? `Encontramos ${conductoresDisponibles.length} disponibles para tu carga.`
                  : "Nadie tiene capacidad suficiente ahora mismo. Intenta más tarde."}
              </p>
            )}

            <div
              style={{
                display: "flex",
                flexDirection: "column",
                gap: 12,
              }}
            >
              {conductoresDisponibles.map((c) => (
                <div
                  key={c.id}
                  style={{
                    background: "#0F1720",
                    border: "1px solid #263141",
                    borderRadius: 10,
                    padding: 18,
                    display: "flex",
                    justifyContent: "space-between",
                    alignItems: "center",
                    gap: 16,
                    flexWrap: "wrap",
                  }}
                >
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 16 }}>
                      {c.nombre}
                    </div>
                    <div
                      style={{ color: "#8A97A3", fontSize: 13, marginTop: 4 }}
                    >
                      {c.vehiculo} ·{" "}
                      {seleccion === "pasajero"
                        ? `${c.capacidad_pasajeros} cupos`
                        : `hasta ${c.capacidad_ton} ton`}
                    </div>
                    <div
                      style={{ color: "#8A97A3", fontSize: 13, marginTop: 4 }}
                    >
                      Tel: {c.telefono}
                    </div>
                  </div>
                  <button
                    onClick={() => setConductorElegido(c)}
                    style={{
                      background: "#FF7A33",
                      border: "none",
                      borderRadius: 8,
                      padding: "10px 16px",
                      color: "#0F1720",
                      fontWeight: 700,
                      fontSize: 14,
                      cursor: "pointer",
                      whiteSpace: "nowrap",
                    }}
                  >
                    Elegir
                  </button>
                </div>
              ))}
            </div>
          </div>
        )}

        {enviado && conductorElegido && (
          <div
            style={{
              background: "#16212C",
              border: "1px solid #263141",
              borderRadius: 14,
              padding: 32,
              textAlign: "center",
            }}
          >
            <div style={{ fontSize: 20, fontWeight: 700, marginBottom: 8 }}>
              Solicitud confirmada
            </div>
            <p style={{ color: "#8A97A3", fontSize: 15, marginBottom: 4 }}>
              {conductorElegido.nombre} te contactará pronto con su{" "}
              {conductorElegido.vehiculo}.
            </p>
            <p style={{ color: "#8A97A3", fontSize: 15, marginBottom: 4 }}>
              Tel: {conductorElegido.telefono}
            </p>
            <p style={{ color: "#8A97A3", fontSize: 15, marginBottom: 24 }}>
              Servicio: {servicio.titulo}
            </p>
            <button
              onClick={volver}
              style={{
                background: "#FF7A33",
                border: "none",
                borderRadius: 8,
                padding: "10px 18px",
                color: "#0F1720",
                fontWeight: 700,
                fontSize: 14,
                cursor: "pointer",
              }}
            >
              Hacer otra solicitud
            </button>
          </div>
        )}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
